<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2e2010"/>
      <stop offset="100%" stop-color="#1a1008"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4a623"/>
      <stop offset="50%" stop-color="#e07b39"/>
      <stop offset="100%" stop-color="#f4a623"/>
    </linearGradient>
  </defs>

  <!-- Outer circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="1.5"/>

  <!-- Inner decorative ring -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="#e07b39" stroke-width="0.5" stroke-dasharray="4 3"/>

  <!-- Top ornament -->
  <path d="M60 14 L63 20 L60 18 L57 20 Z" fill="url(#goldGrad)"/>
  <path d="M48 17 Q60 12 72 17" fill="none" stroke="url(#goldGrad)" stroke-width="0.8"/>

  <!-- Bottom ornament -->
  <path d="M60 106 L63 100 L60 102 L57 100 Z" fill="url(#goldGrad)"/>
  <path d="M48 103 Q60 108 72 103" fill="none" stroke="url(#goldGrad)" stroke-width="0.8"/>

  <!-- Left ornament -->
  <path d="M14 60 L20 57 L18 60 L20 63 Z" fill="url(#goldGrad)"/>
  <!-- Right ornament -->
  <path d="M106 60 L100 57 L102 60 L100 63 Z" fill="url(#goldGrad)"/>

  <!-- Z letter - calligraphy style -->
  <path d="M32 36 Q34 33 50 33 Q52 33 52 35 Q52 36 50 37 L36 55 Q34 57 34 58 Q34 59 36 59 L52 59 Q54 59 54 61 Q54 63 52 63 L34 63 Q30 63 30 60 Q30 58 32 56 L46 38 Q47 37 46 37 L32 37 Q30 37 30 36 Q30 35 32 36 Z" fill="url(#goldGrad)"/>

  <!-- Decorative dot on Z -->
  <circle cx="41" cy="48" r="1.2" fill="#f4a623" opacity="0.6"/>

  <!-- T letter - calligraphy style -->
  <path d="M58 33 Q60 31 62 33 L62 37 L72 37 Q75 37 75 39 Q75 41 72 40 L66 40 L66 61 Q66 64 64 65 Q62 66 60 65 Q58 64 58 61 L58 40 L48 40 Q45 41 45 39 Q45 37 48 37 L58 37 Z" fill="url(#goldGrad)"/>

  <!-- Decorative swash under ZT -->
  <path d="M28 70 Q60 66 92 70" fill="none" stroke="url(#goldGrad)" stroke-width="0.8"/>
  <path d="M34 73 Q60 69 86 73" fill="none" stroke="#f4a623" stroke-width="0.4" opacity="0.5"/>

  <!-- Tagline text -->
  <text x="60" y="85" text-anchor="middle" font-family="Georgia, serif" font-size="6.5" fill="#f4a623" letter-spacing="2.5">THE ZAFRAN</text>
  <text x="60" y="94" text-anchor="middle" font-family="Georgia, serif" font-size="5.5" fill="#e07b39" letter-spacing="4">TALES</text>

  <!-- Corner flourishes -->
  <path d="M22 22 Q26 18 30 22" fill="none" stroke="url(#goldGrad)" stroke-width="0.8"/>
  <path d="M90 22 Q94 18 98 22" fill="none" stroke="url(#goldGrad)" stroke-width="0.8"/>
  <path d="M22 98 Q26 102 30 98" fill="none" stroke="url(#goldGrad)" stroke-width="0.8"/>
  <path d="M90 98 Q94 102 98 98" fill="none" stroke="url(#goldGrad)" stroke-width="0.8"/>
</svg>
